---
# Bubble Glass v1.4.1
# Derived from the MIT-licensed Bubble theme by Clooos.
# https://github.com/Clooos/Bubble
Bubble Glass:
  card-mod-theme: "Bubble Glass"

  # Shared geometry and spacing
  primary-font-family: >-
    Inter, ui-rounded, "SF Pro Display", -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "var(--primary-font-family)"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  ha-card-header-font-family: "var(--primary-font-family)"
  ha-card-border-radius: "28px"
  ha-dialog-border-radius: "28px"
  control-button-border-radius: "50px"
  grid-card-gap: "16px"
  horizontal-stack-card-gap: "16px"
  vertical-stack-card-gap: "16px"
  masonry-view-card-margin: "8px 8px 16px"

  # Bubble Card geometry, matching the original Bubble theme's roundness.
  # Cards are pills (half the row height), icons are circles, the pop-up
  # keeps its 42px default. Theme keys omit the CSS -- prefix.
  bubble-border-radius: "calc(var(--row-height, 56px) / 2)"
  bubble-icon-border-radius: "50%"
  bubble-pop-up-border-radius: "42px"
  bubble-sub-slider-height: "40px"
  bubble-footer-width: "calc(100% - 32px)"
  bubble-footer-bottom: "16px"

  # State colors stay semantic in both modes.
  state-active-color: "var(--accent-color)"
  state-inactive-color: "var(--disabled-text-color)"
  state-light-active-color: "#ffd166"
  state-climate-heat-color: "#ff7a90"
  state-climate-cool-color: "#54c7ff"
  state-lock-locked-color: "#7ae7b8"
  state-lock-unlocked-color: "#ff9d66"
  state-alarm_control_panel-armed_away-color: "#ff7a90"
  state-alarm_control_panel-armed_home-color: "#7ae7b8"
  success-color: "#42d6a4"
  warning-color: "#ffca62"
  error-color: "#ff6685"
  info-color: "var(--accent-color)"

  modes:
    dark:
      # Core palette
      primary-color: "#68d8ff"
      accent-color: "#8b7cff"
      accent-medium-color: "#8b7cff"
      primary-text-color: "#f7f9ff"
      text-primary-color: "#f7f9ff"
      secondary-text-color: "#c3c9dc"
      disabled-text-color: "#747c94"
      text-medium-color: "#a4acc2"
      text-medium-light-color: "#c3c9dc"
      primary-background-color: "#080b18"
      secondary-background-color: "rgba(22, 29, 55, 0.76)"
      clear-background-color: "rgba(13, 18, 38, 0.72)"
      divider-color: "rgba(188, 220, 255, 0.14)"
      scrollbar-thumb-color: "rgba(188, 220, 255, 0.28)"
      label-badge-background-color: "rgba(160, 200, 255, 0.14)"
      label-badge-text-color: "var(--primary-text-color)"
      ha-chip-background-color: "rgba(160, 200, 255, 0.12)"

      # Layered gradients give every glass surface something to refract.
      lovelace-background: >-
        radial-gradient(circle at 12% 6%, rgba(64, 214, 255, 0.30), transparent 42%),
        radial-gradient(circle at 88% 14%, rgba(151, 99, 255, 0.32), transparent 40%),
        radial-gradient(circle at 55% 96%, rgba(56, 120, 255, 0.26), transparent 44%),
        radial-gradient(circle at 82% 78%, rgba(255, 94, 175, 0.12), transparent 36%),
        linear-gradient(160deg, #05070f 0%, #0c1124 40%, #131843 66%, #070a19 100%)
      background-image: "var(--lovelace-background)"

      # Glass surfaces
      ha-card-background: "rgba(22, 30, 58, 0.55)"
      card-background-color: "var(--ha-card-background)"
      ha-card-border-color: "rgba(200, 230, 255, 0.22)"
      ha-card-border-width: "1px"
      ha-card-border-style: "solid"
      ha-card-border: "1px solid rgba(200, 230, 255, 0.22)"
      ha-card-box-shadow: >-
        0 22px 50px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -1px 0 rgba(120, 170, 255, 0.06)
      glass-background: "rgba(22, 30, 58, 0.55)"
      glass-background-strong: "rgba(26, 35, 66, 0.88)"
      glass-background-soft: "rgba(160, 200, 255, 0.10)"
      glass-border-color: "rgba(200, 230, 255, 0.22)"
      glass-rim-color: "rgba(120, 170, 255, 0.06)"
      glass-chip-background: "rgba(150, 190, 255, 0.10)"
      glass-highlight-color: "rgba(255, 255, 255, 0.16)"
      glass-shadow: "0 22px 50px rgba(0, 0, 0, 0.42)"
      glass-backdrop-filter: "blur(26px) saturate(170%)"

      # Header and sidebar
      app-header-background-color: "rgba(6, 9, 20, 0.42)"
      app-header-backdrop-filter: "blur(28px) saturate(170%)"
      app-header-text-color: "var(--primary-text-color)"
      app-theme-color: "#10162d"
      sidebar-background-color: "rgba(10, 14, 30, 0.62)"
      sidebar-text-color: "#dce4f8"
      sidebar-icon-color: "#909bb6"
      sidebar-selected-text-color: "#ffffff"
      sidebar-selected-icon-color: "#68d8ff"
      sidebar-selected-background-color: "rgba(104, 216, 255, 0.12)"
      paper-listbox-background-color: "rgba(24, 32, 62, 0.96)"

      # Dialogs and menus
      mdc-dialog-scrim-color: "rgba(2, 4, 12, 0.72)"
      paper-dialog-background-color: "rgba(18, 24, 46, 0.88)"
      ha-dialog-surface-background: "rgba(16, 22, 44, 0.80)"
      ha-dialog-surface-backdrop-filter: "blur(24px) saturate(160%)"
      more-info-header-background: "rgba(255, 255, 255, 0.06)"
      menu-background-color: "rgba(24, 32, 62, 0.96)"

      # Inputs and controls
      input-fill-color: "rgba(255, 255, 255, 0.07)"
      input-ink-color: "var(--primary-text-color)"
      input-label-ink-color: "var(--secondary-text-color)"
      input-disabled-fill-color: "rgba(255, 255, 255, 0.035)"
      input-disabled-ink-color: "var(--disabled-text-color)"
      input-disabled-label-ink-color: "var(--disabled-text-color)"
      input-idle-line-color: "transparent"
      input-dropdown-icon-color: "var(--secondary-text-color)"
      input-hover-line-color: "var(--primary-color)"
      mdc-text-field-fill-color: "rgba(255, 255, 255, 0.07)"
      mdc-text-field-ink-color: "var(--primary-text-color)"
      mdc-text-field-label-ink-color: "var(--secondary-text-color)"
      mdc-select-fill-color: "rgba(255, 255, 255, 0.07)"
      mdc-theme-primary: "var(--accent-color)"
      paper-input-container-focus-color: "var(--primary-color)"
      paper-slider-knob-color: "var(--primary-color)"
      paper-slider-pin-color: "var(--primary-color)"
      paper-slider-active-color: "var(--primary-color)"
      paper-slider-container-color: "rgba(255, 255, 255, 0.16)"
      switch-checked-button-color: "var(--primary-color)"
      switch-checked-track-color: "rgba(104, 216, 255, 0.44)"
      switch-unchecked-button-color: "#8a94ac"
      switch-unchecked-track-color: "rgba(138, 148, 172, 0.30)"
      paper-toggle-button-checked-button-color: "var(--primary-color)"
      paper-toggle-button-checked-bar-color: "rgba(104, 216, 255, 0.44)"
      paper-radio-button-checked-color: "var(--primary-color)"
      code-editor-background-color: "#0d1226"
      codemirror-property: "#68d8ff"

      # Bubble Card glass system
      bubble-main-background-color: "rgba(22, 30, 58, 0.62)"
      bubble-secondary-background-color: "rgba(160, 200, 255, 0.12)"
      bubble-accent-color: "#68d8ff"
      bubble-icon-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-sub-button-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-sub-slider-background-color: "rgba(160, 200, 255, 0.16)"
      bubble-sub-button-dark-text-color: "#08101f"
      bubble-border: "1px solid rgba(200, 230, 255, 0.22)"
      bubble-box-shadow: >-
        0 18px 40px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(120, 170, 255, 0.05)
      bubble-button-main-background-color: "rgba(22, 30, 58, 0.62)"
      bubble-button-icon-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-button-box-shadow: "var(--bubble-box-shadow)"
      bubble-light-white-color: "#fff3c4"
      bubble-media-player-main-background-color: "rgba(22, 30, 58, 0.62)"
      bubble-media-player-slider-background-color: "rgba(160, 200, 255, 0.16)"
      bubble-media-player-icon-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-media-player-box-shadow: "var(--bubble-box-shadow)"
      bubble-cover-main-background-color: "rgba(22, 30, 58, 0.62)"
      bubble-cover-icon-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-cover-box-shadow: "var(--bubble-box-shadow)"
      bubble-select-main-background-color: "rgba(22, 30, 58, 0.62)"
      bubble-select-background-color: "rgba(160, 200, 255, 0.12)"
      bubble-select-list-item-accent-color: "rgba(104, 216, 255, 0.20)"
      bubble-select-list-background-color: "rgba(20, 27, 55, 0.98)"
      bubble-select-arrow-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-select-icon-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-select-box-shadow: "var(--bubble-box-shadow)"
      bubble-climate-main-background-color: "rgba(22, 30, 58, 0.62)"
      bubble-climate-button-background-color: "rgba(160, 200, 255, 0.14)"
      bubble-climate-accent-color: "#68d8ff"
      bubble-climate-box-shadow: "var(--bubble-box-shadow)"
      bubble-calendar-main-background-color: "rgba(22, 30, 58, 0.62)"
      bubble-horizontal-buttons-stack-background-color: "rgba(22, 30, 58, 0.55)"
      bubble-line-background-color: "rgba(200, 230, 255, 0.24)"
      bubble-pop-up-main-background-color: "rgba(160, 200, 255, 0.12)"
      bubble-pop-up-background-color: "rgba(13, 18, 38, 0.82)"
      bubble-backdrop-background-color: "rgba(2, 4, 12, 0.72)"
      bubble-footer-box-shadow: >-
        0 0 0 1px rgba(200, 230, 255, 0.14),
        0 18px 40px rgba(0, 0, 0, 0.50),
        inset 0 1px 0 rgba(255, 255, 255, 0.10)

    light:
      # Core palette
      primary-color: "#1368e8"
      accent-color: "#7257e8"
      accent-medium-color: "#7257e8"
      primary-text-color: "#17213b"
      text-primary-color: "#17213b"
      secondary-text-color: "#52617c"
      disabled-text-color: "#8a96aa"
      text-medium-color: "#65748e"
      text-medium-light-color: "#52617c"
      primary-background-color: "#eaf2ff"
      secondary-background-color: "rgba(255, 255, 255, 0.70)"
      clear-background-color: "rgba(255, 255, 255, 0.58)"
      divider-color: "rgba(45, 72, 112, 0.14)"
      scrollbar-thumb-color: "rgba(45, 72, 112, 0.25)"
      label-badge-background-color: "rgba(255, 255, 255, 0.70)"
      label-badge-text-color: "var(--primary-text-color)"
      ha-chip-background-color: "rgba(214, 234, 255, 0.55)"

      # Layered gradients give every glass surface something to refract.
      lovelace-background: >-
        radial-gradient(circle at 10% 6%, rgba(56, 189, 248, 0.42), transparent 42%),
        radial-gradient(circle at 90% 14%, rgba(167, 139, 250, 0.38), transparent 40%),
        radial-gradient(circle at 46% 96%, rgba(59, 130, 246, 0.28), transparent 44%),
        radial-gradient(circle at 84% 80%, rgba(251, 186, 135, 0.22), transparent 36%),
        linear-gradient(160deg, #f8fbff 0%, #e8f1ff 45%, #ece7ff 72%, #f6f3ff 100%)
      background-image: "var(--lovelace-background)"

      ha-card-background: "rgba(255, 255, 255, 0.55)"
      card-background-color: "var(--ha-card-background)"
      ha-card-border-color: "rgba(255, 255, 255, 0.95)"
      ha-card-border-width: "1px"
      ha-card-border-style: "solid"
      ha-card-border: "1px solid rgba(255, 255, 255, 0.95)"
      ha-card-box-shadow: >-
        0 22px 48px rgba(55, 78, 118, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 1),
        inset 0 -1px 0 rgba(120, 160, 255, 0.08)
      glass-background: "rgba(255, 255, 255, 0.55)"
      glass-background-strong: "rgba(255, 255, 255, 0.86)"
      glass-background-soft: "rgba(255, 255, 255, 0.42)"
      glass-border-color: "rgba(255, 255, 255, 0.95)"
      glass-rim-color: "rgba(120, 160, 255, 0.08)"
      glass-chip-background: "rgba(255, 255, 255, 0.45)"
      glass-highlight-color: "rgba(255, 255, 255, 1)"
      glass-shadow: "0 22px 48px rgba(55, 78, 118, 0.20)"
      glass-backdrop-filter: "blur(24px) saturate(180%) brightness(1.06)"

      # Header and sidebar
      app-header-background-color: "rgba(248, 251, 255, 0.45)"
      app-header-backdrop-filter: "blur(28px) saturate(170%)"
      app-header-text-color: "var(--primary-text-color)"
      app-theme-color: "#dcecff"
      sidebar-background-color: "rgba(245, 250, 255, 0.66)"
      sidebar-text-color: "#34435f"
      sidebar-icon-color: "#71809a"
      sidebar-selected-text-color: "#17213b"
      sidebar-selected-icon-color: "#1368e8"
      sidebar-selected-background-color: "rgba(19, 104, 232, 0.10)"
      paper-listbox-background-color: "rgba(250, 252, 255, 0.96)"

      # Dialogs and menus
      mdc-dialog-scrim-color: "rgba(32, 46, 74, 0.38)"
      paper-dialog-background-color: "rgba(255, 255, 255, 0.88)"
      ha-dialog-surface-background: "rgba(255, 255, 255, 0.78)"
      ha-dialog-surface-backdrop-filter: "blur(24px) saturate(160%)"
      more-info-header-background: "rgba(255, 255, 255, 0.45)"
      menu-background-color: "rgba(250, 252, 255, 0.96)"

      # Inputs and controls
      input-fill-color: "rgba(255, 255, 255, 0.52)"
      input-ink-color: "var(--primary-text-color)"
      input-label-ink-color: "var(--secondary-text-color)"
      input-disabled-fill-color: "rgba(255, 255, 255, 0.28)"
      input-disabled-ink-color: "var(--disabled-text-color)"
      input-disabled-label-ink-color: "var(--disabled-text-color)"
      input-idle-line-color: "transparent"
      input-dropdown-icon-color: "var(--secondary-text-color)"
      input-hover-line-color: "var(--primary-color)"
      mdc-text-field-fill-color: "rgba(255, 255, 255, 0.52)"
      mdc-text-field-ink-color: "var(--primary-text-color)"
      mdc-text-field-label-ink-color: "var(--secondary-text-color)"
      mdc-select-fill-color: "rgba(255, 255, 255, 0.52)"
      mdc-theme-primary: "var(--accent-color)"
      paper-input-container-focus-color: "var(--primary-color)"
      paper-slider-knob-color: "var(--primary-color)"
      paper-slider-pin-color: "var(--primary-color)"
      paper-slider-active-color: "var(--primary-color)"
      paper-slider-container-color: "rgba(23, 33, 59, 0.14)"
      switch-checked-button-color: "var(--primary-color)"
      switch-checked-track-color: "rgba(19, 104, 232, 0.32)"
      switch-unchecked-button-color: "#8a96aa"
      switch-unchecked-track-color: "rgba(82, 97, 124, 0.22)"
      paper-toggle-button-checked-button-color: "var(--primary-color)"
      paper-toggle-button-checked-bar-color: "rgba(19, 104, 232, 0.32)"
      paper-radio-button-checked-color: "var(--primary-color)"
      code-editor-background-color: "#eef4ff"
      codemirror-property: "#1368e8"

      # Bubble Card glass system
      bubble-main-background-color: "rgba(255, 255, 255, 0.58)"
      bubble-secondary-background-color: "rgba(214, 234, 255, 0.55)"
      bubble-accent-color: "#1368e8"
      bubble-icon-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-sub-button-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-sub-slider-background-color: "rgba(214, 234, 255, 0.70)"
      bubble-sub-button-dark-text-color: "#17213b"
      bubble-border: "1px solid rgba(255, 255, 255, 0.95)"
      bubble-box-shadow: >-
        0 18px 40px rgba(55, 78, 118, 0.19),
        inset 0 1px 0 rgba(255, 255, 255, 1),
        inset 0 -1px 0 rgba(120, 160, 255, 0.06)
      bubble-button-main-background-color: "rgba(255, 255, 255, 0.58)"
      bubble-button-icon-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-button-box-shadow: "var(--bubble-box-shadow)"
      bubble-light-white-color: "#fff1b5"
      bubble-media-player-main-background-color: "rgba(255, 255, 255, 0.58)"
      bubble-media-player-slider-background-color: "rgba(23, 33, 59, 0.10)"
      bubble-media-player-icon-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-media-player-box-shadow: "var(--bubble-box-shadow)"
      bubble-cover-main-background-color: "rgba(255, 255, 255, 0.58)"
      bubble-cover-icon-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-cover-box-shadow: "var(--bubble-box-shadow)"
      bubble-select-main-background-color: "rgba(255, 255, 255, 0.58)"
      bubble-select-background-color: "rgba(214, 234, 255, 0.55)"
      bubble-select-list-item-accent-color: "rgba(19, 104, 232, 0.16)"
      bubble-select-list-background-color: "rgba(250, 252, 255, 0.96)"
      bubble-select-arrow-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-select-icon-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-select-box-shadow: "var(--bubble-box-shadow)"
      bubble-climate-main-background-color: "rgba(255, 255, 255, 0.58)"
      bubble-climate-button-background-color: "rgba(214, 234, 255, 0.62)"
      bubble-climate-accent-color: "#1368e8"
      bubble-climate-box-shadow: "var(--bubble-box-shadow)"
      bubble-calendar-main-background-color: "rgba(255, 255, 255, 0.58)"
      bubble-horizontal-buttons-stack-background-color: "rgba(255, 255, 255, 0.45)"
      bubble-line-background-color: "rgba(45, 72, 112, 0.20)"
      bubble-pop-up-main-background-color: "rgba(214, 234, 255, 0.60)"
      bubble-pop-up-background-color: "rgba(246, 250, 255, 0.84)"
      bubble-backdrop-background-color: "rgba(32, 46, 74, 0.38)"
      bubble-footer-box-shadow: >-
        0 0 0 1px rgba(45, 72, 112, 0.10),
        0 18px 40px rgba(55, 78, 118, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 1)

  # card-mod adds real blur to standard Home Assistant cards. Bubble Card uses
  # its public theme variables above and does not depend on private selectors.
  card-mod-card: |
    ha-card {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(150deg, var(--glass-highlight-color, transparent) 0%, transparent 42%),
        var(--glass-background, var(--ha-card-background));
      border: 1px solid var(--glass-border-color, var(--ha-card-border-color));
      box-shadow:
        var(--glass-shadow, var(--ha-card-box-shadow)),
        inset 0 1px 0 var(--glass-highlight-color, transparent),
        inset 0 -1px 0 var(--glass-rim-color, transparent);
      backdrop-filter: var(--glass-backdrop-filter, none);
      -webkit-backdrop-filter: var(--glass-backdrop-filter, none);
      transition: transform 180ms ease, border-color 180ms ease,
        box-shadow 180ms ease;
    }
    @media (prefers-reduced-motion: reduce) {
      ha-card {
        transition: none;
      }
    }

  card-mod-sidebar: |
    :host {
      backdrop-filter: var(--glass-backdrop-filter, none);
      -webkit-backdrop-filter: var(--glass-backdrop-filter, none);
    }

  card-mod-root: |
    app-header,
    .header {
      backdrop-filter: var(--app-header-backdrop-filter, none);
      -webkit-backdrop-filter: var(--app-header-backdrop-filter, none);
      border-bottom: 1px solid var(--divider-color);
    }
