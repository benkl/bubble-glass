<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Bubble Glass theme preview</title>
  <desc id="desc">A stylized Home Assistant dashboard with translucent cyan and violet cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.55" stop-color="#11152b"/>
      <stop offset="1" stop-color="#090d1f"/>
    </linearGradient>
    <radialGradient id="cyan">
      <stop stop-color="#40d6ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#40d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop stop-color="#9763ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9763ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9ebcff" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="160" cy="80" r="280" fill="url(#cyan)" filter="url(#blur)"/>
  <circle cx="1050" cy="150" r="300" fill="url(#violet)" filter="url(#blur)"/>
  <circle cx="620" cy="680" r="340" fill="url(#cyan)" opacity=".3" filter="url(#blur)"/>
  <text x="72" y="92" fill="#f7f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">Bubble Glass</text>
  <text x="73" y="126" fill="#c3c9dc" font-family="Inter,Segoe UI,sans-serif" font-size="20">Home Assistant theme for Bubble Card</text>
  <g filter="url(#shadow)" stroke="#d7ebff" stroke-opacity=".2">
    <rect x="70" y="170" width="500" height="138" rx="28" fill="url(#glass)"/>
    <rect x="600" y="170" width="530" height="138" rx="28" fill="url(#glass)"/>
    <rect x="70" y="338" width="330" height="220" rx="28" fill="url(#glass)"/>
    <rect x="430" y="338" width="330" height="220" rx="28" fill="url(#glass)"/>
    <rect x="790" y="338" width="340" height="220" rx="28" fill="url(#glass)"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif">
    <circle cx="128" cy="239" r="34" fill="#68d8ff" fill-opacity=".16"/>
    <path d="M128 220a18 18 0 0 0-10 33v8h20v-8a18 18 0 0 0-10-33Z" fill="none" stroke="#68d8ff" stroke-width="4"/>
    <text x="182" y="232" fill="#f7f9ff" font-size="25" font-weight="650">Ambient lights</text>
    <text x="182" y="264" fill="#c3c9dc" font-size="18">72% · warm white</text>
    <rect x="385" y="220" width="150" height="38" rx="19" fill="#68d8ff" fill-opacity=".18"/>
    <circle cx="512" cy="239" r="14" fill="#68d8ff"/>
    <circle cx="658" cy="239" r="34" fill="#9763ff" fill-opacity=".18"/>
    <text x="712" y="232" fill="#f7f9ff" font-size="25" font-weight="650">Living room</text>
    <text x="712" y="264" fill="#c3c9dc" font-size="18">21.5°C · 46%</text>
    <text x="100" y="393" fill="#f7f9ff" font-size="23" font-weight="650">Climate</text>
    <text x="100" y="470" fill="#68d8ff" font-size="54" font-weight="700">21°</text>
    <text x="460" y="393" fill="#f7f9ff" font-size="23" font-weight="650">Now playing</text>
    <rect x="460" y="425" width="88" height="88" rx="22" fill="#9763ff" fill-opacity=".25"/>
    <text x="570" y="462" fill="#f7f9ff" font-size="20" font-weight="650">Glass Echoes</text>
    <text x="570" y="491" fill="#c3c9dc" font-size="17">Living room speaker</text>
    <text x="820" y="393" fill="#f7f9ff" font-size="23" font-weight="650">Rooms</text>
    <rect x="820" y="425" width="280" height="54" rx="20" fill="#fff" fill-opacity=".08"/>
    <rect x="820" y="492" width="280" height="54" rx="20" fill="#fff" fill-opacity=".08"/>
    <text x="845" y="459" fill="#f7f9ff" font-size="18">Kitchen</text>
    <text x="845" y="526" fill="#f7f9ff" font-size="18">Bedroom</text>
  </g>
  <rect x="398" y="603" width="404" height="48" rx="24" fill="#141b34" fill-opacity=".84" stroke="#d7ebff" stroke-opacity=".2"/>
  <circle cx="470" cy="627" r="14" fill="#68d8ff"/>
  <circle cx="600" cy="627" r="14" fill="#fff" fill-opacity=".28"/>
  <circle cx="730" cy="627" r="14" fill="#fff" fill-opacity=".28"/>
</svg>
