---
# Bubble Glass global module.
#
# Install: copy this file to <config>/bubble-modules.yaml (merge if already present)
# and restart Home Assistant, or create it in any Bubble Card under
# Modules > Create new module with "All cards" enabled.
bubble_glass:
  name: "Bubble Glass"
  version: "1.5"
  creator: "benkl"
  description: >-
    Backdrop blur for Bubble Card rows, frameless separators, pop-up close button glass,
    and floating glass pills for all footer buttons (overriding JS inline borders).
  is_global: true
  code: |
    /* Bubble Card standard cards: backdrop blur */
    .bubble-container:not(.bubble-separator) {
      backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
      -webkit-backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
    }

    /* Separators: strictly frameless typography & line only */
    .bubble-separator.separator-container,
    .bubble-container.bubble-separator {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* Pop-up header action & close buttons: full glass styling */
    .bubble-header-action-button,
    .bubble-close-button {
      background: var(--glass-chip-background, rgba(255, 255, 255, 0.45)) !important;
      backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
      -webkit-backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
      border: 1px solid var(--glass-border-color, rgba(255, 255, 255, 0.7)) !important;
      box-shadow: var(--ha-card-box-shadow, 0 8px 24px rgba(0, 0, 0, 0.15)) !important;
    }

    /* Footer buttons match standard Bubble Card buttons: one native Bubble
       surface, one radius, one shadow. Do not add a second chip border. */
    .horizontal-buttons-stack-card .bubble-button {
      border-radius: var(--bubble-border-radius, 32px) !important;
      overflow: hidden !important;
    }
    .horizontal-buttons-stack-card .bubble-button .bubble-background {
      background-color: var(--bubble-main-background-color, var(--glass-background)) !important;
      border: none !important;
      box-shadow: var(--bubble-box-shadow, var(--glass-shadow)) !important;
      opacity: 1 !important;
      backdrop-filter: var(--glass-backdrop-filter, blur(26px)) !important;
      -webkit-backdrop-filter: var(--glass-backdrop-filter, blur(26px)) !important;
    }
    .horizontal-buttons-stack-card .bubble-button .bubble-background-color {
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
