---
# Bubble Glass global module.
#
# Install: copy this file to <config>/bubble-modules.yaml (merge if already present)
# and restart Home Assistant, or create it in any Bubble Card under
# Modules > Create new module with "All cards" enabled.
bubble_glass:
  name: "Bubble Glass"
  version: "1.7"
  creator: "benkl"
  description: >-
    Glass styling for Bubble Card rows, pop-up actions, and footer buttons without breaking dropdown placement.
  is_global: true
  code: |
    /* Bubble Card rows use the background leaf, never .bubble-container.
       A filtered container becomes a containing block and breaks fixed menus. */
    .bubble-container:not(.bubble-separator) > .bubble-wrapper > .bubble-background {
      backdrop-filter: var(--glass-backdrop-filter, blur(12px)) !important;
      -webkit-backdrop-filter: var(--glass-backdrop-filter, blur(12px)) !important;
    }

    /* Separators stay frameless */
    .bubble-separator.separator-container,
    .bubble-container.bubble-separator {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* Pop-up close / back action buttons. The pop-up shell already owns the
       backdrop blur, so these use the same tint, edge, and shadow only. */
    .bubble-header-action-button,
    .bubble-close-button {
      background: var(--glass-chip-background, rgba(255, 255, 255, 0.14)) !important;
      border: 1px solid var(--glass-border-color, rgba(255, 255, 255, 0.30)) !important;
      box-shadow: var(--ha-card-box-shadow, 0 8px 32px rgba(0, 0, 0, 0.10)) !important;
    }

    /* Footer buttons match the native Bubble Card surface. */
    .horizontal-buttons-stack-card .bubble-button {
      border-radius: var(--bubble-border-radius, 32px) !important;
      overflow: hidden !important;
    }
    .horizontal-buttons-stack-card .bubble-button .bubble-background {
      background-color: var(--bubble-main-background-color, var(--glass-background)) !important;
      border: none !important;
      box-shadow: var(--bubble-box-shadow, var(--glass-shadow)) !important;
      opacity: 1 !important;
    }
    /* Bubble Card sets an inactive inline border here. Keep the layer only
       for state color, never for a second border or shadow. */
    .horizontal-buttons-stack-card .bubble-button .bubble-background-color {
      border: none !important;
      box-shadow: none !important;
    }
