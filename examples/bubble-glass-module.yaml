---
# Bubble Glass global module (optional, recommended).
#
# Install (see README, "Install the Bubble Card module"):
# - Bubble Card Tools: in any Bubble Card editor open Modules > My Modules >
#   Import Module and paste this whole file, or copy it to
#   /config/bubble_card/modules/bubble_glass.yaml and reload the page.
# - Legacy setup without Bubble Card Tools: merge it into
#   /config/bubble-modules.yaml and restart Home Assistant.
bubble_glass:
  name: "Bubble Glass"
  version: "2.0"
  creator: "benkl"
  description: >-
    Frosted blur, sheen, and rim light for Bubble Card rows, chips, pop-up actions,
    and footer buttons, without breaking fixed footers or dropdown placement.
  is_global: true
  code: |
    /* Row surface: sheen over the tint. Separators and sub-button cards with
       hide_main_background stay clear. */
    .bubble-container:not(.bubble-separator):not(.no-background) {
      background-image: var(--glass-sheen, none);
      border-color: transparent;
    }

    /* Rim light: a gradient ring just inside the row edge, bright at the
       top-left. It replaces the flat border, which stays as transparent space. */
    .bubble-container:not(.bubble-separator):not(.no-background)::after,
    .horizontal-buttons-stack-card .bubble-button::after {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: var(--glass-rim, none);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .horizontal-buttons-stack-card .bubble-button::after {
      z-index: 3;
    }
    /* Blur the background leaf, never .bubble-container. A filtered container
       becomes a containing block and breaks fixed menus. */
    .bubble-container:not(.bubble-separator) > .bubble-wrapper > .bubble-background {
      -webkit-backdrop-filter: var(--glass-backdrop-filter, blur(16px));
      backdrop-filter: var(--glass-backdrop-filter, blur(16px));
    }

    /* Icon and sub-button chips get a hairline edge so they read as inset
       glass instead of a flat tint. */
    .bubble-icon-container,
    .bubble-sub-button {
      box-shadow: inset 0 0 0 1px var(--glass-border-color, rgba(255, 255, 255, 0.10));
    }

    /* Separators stay frameless. */
    .bubble-separator.separator-container,
    .bubble-container.bubble-separator {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
    }

    /* Pop-up close and back buttons. The pop-up shell already owns the
       backdrop blur, so these carry tint, edge, and highlight only. */
    .bubble-header-action-button,
    .bubble-close-button {
      background: var(--glass-chip, rgba(255, 255, 255, 0.08)) !important;
      border: 1px solid var(--glass-border-color, rgba(255, 255, 255, 0.10)) !important;
      box-shadow: var(--glass-shadow-row, none) !important;
    }

    /* Footer buttons use the same surface as a standard Bubble Card row. */
    .horizontal-buttons-stack-card .bubble-button {
      border-radius: var(--bubble-border-radius, 32px) !important;
      overflow: hidden !important;
      box-shadow: var(--bubble-footer-box-shadow, var(--glass-shadow-float, none));
    }
    .horizontal-buttons-stack-card .bubble-button .bubble-background {
      background-color: var(--bubble-main-background-color, var(--glass-surface)) !important;
      background-image: var(--glass-sheen, none);
      border: none !important;
      opacity: 1 !important;
    }
    /* Bubble Card writes an inline inactive border on this layer. Keep it only
       for the state color, never for a second border or shadow. */
    .horizontal-buttons-stack-card .bubble-button .bubble-background-color {
      border: none !important;
      box-shadow: none !important;
    }
