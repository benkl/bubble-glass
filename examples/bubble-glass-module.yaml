---
# Bubble Glass global module.
#
# Install: copy this file to <config>/bubble-modules.yaml (merge if already present)
# and restart Home Assistant, or create it in any Bubble Card under
# Modules > Create new module with "All cards" enabled.
bubble_glass:
  name: "Bubble Glass"
  version: "1.3"
  creator: "benkl"
  description: >-
    Backdrop blur for Bubble Card rows, frameless separators, and floating glass pills for all footer buttons.
  is_global: true
  code: |
    /* Bubble Card standard cards: backdrop blur */
    .bubble-container:not(.bubble-separator) {
      backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
      -webkit-backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
    }

    /* Separators: strictly frameless typography & line only, zero container box */
    .bubble-separator.separator-container,
    .bubble-container.bubble-separator {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* All bottom menu buttons (links, navigation, pop-up/drawer triggers):
       floating glass pills with blur, highlight, and volumetric shadow */
    .horizontal-buttons-stack-card .bubble-button .bubble-background {
      background-color: var(--glass-background, rgba(255, 255, 255, 0.45)) !important;
      backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
      -webkit-backdrop-filter: var(--glass-backdrop-filter, blur(20px)) !important;
      border: 1px solid var(--glass-border-color, rgba(255, 255, 255, 0.7)) !important;
      box-shadow: var(--ha-card-box-shadow, 0 8px 24px rgba(0, 0, 0, 0.15)) !important;
      opacity: 1 !important;
    }

    /* Active highlight: keep accent fill, hide dark stock border */
    .horizontal-buttons-stack-card .bubble-button .bubble-background-color {
      border-color: transparent !important;
    }
