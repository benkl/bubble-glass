---
# Bubble Glass global module.
#
# Install: copy this file to <config>/bubble-modules.yaml (merge if the file
# already exists), restart Home Assistant (or reload the browser), then open
# any Bubble Card, Modules, and make sure "Bubble Glass" is listed and applied
# to all cards. If the module is loaded, the footer card's shadow DOM shows a
# second <style> tag with the rules below; if that tag is empty, the module
# is not loading and the footer stays flat.
#
# The module reads the Bubble Glass theme tokens (--glass-*), so it follows
# light and dark mode automatically:
# - real backdrop blur on every Bubble Card row
# - the fixed footer bar itself becomes the pinned glass slab, so dashboard
#   content scrolling underneath smears through it
# - glass chips for the footer buttons
bubble_glass:
  name: "Bubble Glass"
  version: "1.1"
  creator: "benkl"
  description: >-
    Backdrop blur for Bubble Card rows, a pinned glass slab for the footer
    bar, and glass chips for the footer buttons. Follows the Bubble Glass
    theme tokens for light and dark mode.
  is_global: true
  code: |
    /* Every Bubble Card row: real backdrop blur */
    .bubble-container {
      backdrop-filter: var(--glass-backdrop-filter, none) !important;
      -webkit-backdrop-filter: var(--glass-backdrop-filter, none) !important;
    }

    /* The fixed footer bar becomes the pinned glass slab. Stock Bubble Card
       leaves the bar itself without a background (each button carries its
       own tint layers), so background, edge, radius and lift all live here.
       The bar is position:fixed, so dashboard content scrolling underneath
       is blurred through it. */
    .horizontal-buttons-stack-card {
      background: var(--glass-background, transparent);
      backdrop-filter: var(--glass-backdrop-filter, none);
      -webkit-backdrop-filter: var(--glass-backdrop-filter, none);
      border-radius: var(--bubble-border-radius, 32px);
      border: 1px solid var(--glass-border-color, transparent);
      box-shadow: var(--bubble-footer-box-shadow, none);
    }

    /* Footer button chips. The inactive layer (.bubble-background) has a
       hardcoded 0.8 opacity which hides the blur behind it, so we force
       opacity:1 and use the glass-chip-background token (very translucent)
       to let the blur show through. */
    .bubble-button .bubble-background {
      opacity: 1 !important;
      background-color: var(--glass-chip-background, rgba(255, 255, 255, 0.18)) !important;
      border: 1px solid var(--glass-border-color, transparent) !important;
      box-shadow: inset 0 1px 0 var(--glass-highlight-color, transparent) !important;
      backdrop-filter: blur(14px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(14px) saturate(160%) !important;
    }

    /* Active highlight keeps its JS-driven accent fill; hide its stock dark
       border so exactly one edge renders per button. */
    .bubble-button .bubble-background-color {
      border-color: transparent !important;
    }
